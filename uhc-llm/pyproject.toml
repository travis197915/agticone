[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uhc-llm"
version = "0.1.0"
description = "Env-driven LLM routing: direct API keys or UHG MODEL_REGISTRY gateway"
requires-python = ">=3.11"
dependencies = [
    "openai>=2.0",
    "anthropic>=0.40",
    "httpx>=0.28",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
keyvault = [
    "azure-identity>=1.16",
    "azure-keyvault-secrets>=4.8",
]

[project.scripts]
uhc-llm-export-registry = "uhc_llm.export_registry_env:main"
uhc-llm-run-registry = "uhc_llm.run_registry:main"

[tool.setuptools.packages.find]
where = ["src"]
