[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uhc-execution-engine"
version = "0.1.0"
description = "Rule execution engine: Excel of claim ids in, per-claim SOP-rule adjudication out"
requires-python = ">=3.11"
dependencies = [
    "uhc-llm",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.2",
    "langchain-openai>=0.2",
    "openpyxl>=3.1",
    "pydantic>=2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
